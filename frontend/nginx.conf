server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }
    # Resolve the service again after Docker recreates the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    location /api/ {
        set $api_backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
