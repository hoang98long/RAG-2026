x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    logging: *default-logging
    restart: unless-stopped
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
  chroma:
    profiles: ["legacy-chroma"]
    image: chromadb/chroma:latest
    volumes: [chroma_data:/chroma/chroma]
    ports: ["127.0.0.1:8001:8000"]
  backend:
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 10m
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/storage/rag.db
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      CHUNK_SIZE: ${CHUNK_SIZE:-1600}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-240}
      TOP_K: ${TOP_K:-6}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-48}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.0}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-14000}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-2048}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a question, retrieve relevant document passages that answer the question.}
      RERANK_BACKEND: ${RERANK_BACKEND:-ollama}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-32}
      RERANK_DIVERSITY_LAMBDA: ${RERANK_DIVERSITY_LAMBDA:-0.75}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-6}
      RERANK_MIN_GRADE: ${RERANK_MIN_GRADE:-2}
      RERANK_TIMEOUT: ${RERANK_TIMEOUT:-120}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-BAAI/bge-reranker-v2-m3}
      CROSS_ENCODER_DEVICE: ${CROSS_ENCODER_DEVICE:-cpu}
      CROSS_ENCODER_MAX_LENGTH: ${CROSS_ENCODER_MAX_LENGTH:-1024}
      CITATION_REPAIR: ${CITATION_REPAIR:-true}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-200}
      UPLOAD_MAX_REQUEST_MB: ${UPLOAD_MAX_REQUEST_MB:-512}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-20}
      INDEX_PAGE_SIZE: ${INDEX_PAGE_SIZE:-500}
      PUBLIC_DATABASE_URL: sqlite:////app/storage/public/public.db
      PUBLIC_CHROMA_DIR: /app/public_chroma_data
      PUBLIC_UPLOAD_DIR: /app/storage/public/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      INTERNAL_ACCESS_TOKEN: ${INTERNAL_ACCESS_TOKEN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-14400}
      PUBLIC_CHAT_RATE_LIMIT: ${PUBLIC_CHAT_RATE_LIMIT:-20}
      PUBLIC_CHAT_MAX_CONCURRENT: ${PUBLIC_CHAT_MAX_CONCURRENT:-2}
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-90}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}
      REVIEW_BATCH_SIZE: ${REVIEW_BATCH_SIZE:-6}
      REPORT_CONTEXT_CHARS: ${REPORT_CONTEXT_CHARS:-10000}
      REPORT_SECTION_CHUNKS: ${REPORT_SECTION_CHUNKS:-8}
      REPORT_RERANK_CANDIDATES: ${REPORT_RERANK_CANDIDATES:-12}
      REPORT_MAX_SECONDS: ${REPORT_MAX_SECONDS:-420}
      QUERY_EXPANSION: ${QUERY_EXPANSION:-true}
      GROUNDING_VERIFICATION: ${GROUNDING_VERIFICATION:-true}
      EVIDENCE_MAX_CHUNKS: ${EVIDENCE_MAX_CHUNKS:-80}
      EXHAUSTIVE_CONTEXT_CHARS: ${EXHAUSTIVE_CONTEXT_CHARS:-32000}
      EXHAUSTIVE_NUM_PREDICT: ${EXHAUSTIVE_NUM_PREDICT:-4096}
      NEIGHBOR_CHUNKS: ${NEIGHBOR_CHUNKS:-1}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DIR: /app/chroma_data
      UPLOAD_DIR: /app/storage/uploads
    volumes: [uploads:/app/storage, chroma_data:/app/chroma_data, public_chroma_data:/app/public_chroma_data]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on: [ollama]
  frontend:
    logging: *default-logging
    restart: unless-stopped
    build: ./frontend
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
volumes:
  public_chroma_data:
  chroma_data:
  uploads:
  ollama_data:
