services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
  chroma:
    image: chromadb/chroma:latest
    volumes: [chroma_data:/chroma/chroma]
    ports: ["8001:8000"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/storage/rag.db
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DIR: /app/chroma_data
      UPLOAD_DIR: /app/storage/uploads
    volumes: [uploads:/app/storage, chroma_data:/app/chroma_data]
    ports: ["8000:8000"]
    depends_on: [ollama]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  chroma_data:
  uploads:
  ollama_data:
